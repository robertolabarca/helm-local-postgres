apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-service 
spec:
  selector:
    app: {{ .Chart.Name }}  # Selector to find the pods to be exposed by the service
  ports:
  - protocol: TCP
    port: {{ .Values.service.port }}  # Port exposed by the service
    targetPort: {{ .Values.service.port }}  # Port on the container to which traffic is forwarded
    nodePort: 30080
  type: {{ .Values.service.type }}
